<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#060b19">
    <title>Blue Search</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/HackerOS-Linux-System/Blue-Environment/main/images/logo.png">
    <link rel="stylesheet" href="blue.css">
    <!--
        blue.html - ukryta podstrona "Blue Edition".
        Nie ma do niej żadnego linku z index.html - zwykły użytkownik nie wie o jej istnieniu.
        Służy jako strona startowa / wyszukiwarka w środowisku graficznym Blue.
        Logika: src/blue.ts (kompilowane do blue.js przez scripts/build.ts).
    -->
</head>
<body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <header class="topbar">
        <div class="topbar-left">
            <a class="brand" href="blue.html" aria-label="Blue">
                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>
                    <i class="brand-dot"></i>
                </span>
                <span class="brand-name">Blue</span>
            </a>

            <div class="launcher" id="launcher">
                <label class="launcher-field">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="launcherInput" placeholder="Search apps..." autocomplete="off" spellcheck="false" aria-label="Szukaj aplikacji" aria-controls="launcherList" aria-expanded="false">
                </label>
                <ul class="launcher-list" id="launcherList" role="listbox" hidden></ul>
            </div>
        </div>

        <nav class="dock" aria-label="Szybkie skróty">
            <a class="dock-btn" id="dockDocs" href="https://hackeros-linux-system.github.io/HackerOS-Website/tools-docs/index.html" target="_blank" rel="noopener" title="Dokumentacja">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg>
            </a>
            <a class="dock-btn" id="dockGit" href="https://github.com/HackerOS-Linux-System" target="_blank" rel="noopener" title="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
            </a>
            <a class="dock-btn" id="dockWeb" href="https://hackeros-linux-system.github.io/HackerOS-Website/" target="_blank" rel="noopener" title="HackerOS">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            </a>
            <button class="dock-btn" id="settingsBtn" type="button" title="Ustawienia" aria-haspopup="true" aria-expanded="false" aria-controls="settingsPanel">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </nav>

        <div class="tray">
            <span class="workspaces" aria-hidden="true"><i class="ws ws-on"></i><i class="ws"></i><i class="ws"></i><i class="ws"></i></span>
            <svg class="tray-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
            <span class="net" id="net" title="Połączenie">
                <svg class="tray-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
            </span>
            <time class="clock" id="clock">--:--</time>
            <span class="bell">
                <svg class="tray-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                <i class="bell-dot"></i>
            </span>
        </div>
    </header>

    <div class="settings" id="settingsPanel" role="dialog" aria-label="Ustawienia" hidden>
        <label class="switch"><input type="checkbox" id="opt24h"><span class="switch-ui"></span><span id="opt24hLabel">Zegar 24-godzinny</span></label>
        <label class="switch"><input type="checkbox" id="optMotion"><span class="switch-ui"></span><span id="optMotionLabel">Migotanie gwiazd</span></label>
    </div>

    <main class="stage">
        <img class="logo" src="https://raw.githubusercontent.com/HackerOS-Linux-System/Blue-Environment/main/images/icon.png" alt="Blue" draggable="false">

        <form class="search" id="searchForm" action="https://www.ecosia.org/search" method="GET" role="search" aria-label="Wyszukiwarka Ecosia">
            <input type="text" class="search-input" id="searchInput" name="q" placeholder="Wyszukaj w Ecosia..." required autocomplete="off" autofocus aria-label="Wprowadź frazę wyszukiwania">
            <button type="submit" class="search-btn" aria-label="Szukaj">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </button>
        </form>
    </main>

    <script src="blue.js" defer></script>
</body>
</html>
