<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#060b19">
    <title>Blue Search</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/HackerOS-Linux-System/Blue-Environment/main/images/logo.png">
    <link rel="stylesheet" href="blue.css">
    <!--
        blue.html - ukryta podstrona "Blue Edition".
        Nie ma do niej żadnego linku z index.html - zwykły użytkownik nie wie o jej istnieniu.
        Służy jako strona startowa / wyszukiwarka w środowisku graficznym Blue.
        Logika: src/blue.ts (kompilowane do blue.js przez scripts/build.ts).
        Brak górnego paska - tylko animowany kosmos, logo i wyszukiwarka.
    -->
</head>
<body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <main class="stage">
        <img class="logo" src="https://raw.githubusercontent.com/HackerOS-Linux-System/Blue-Environment/main/images/icon.png" alt="Blue" draggable="false">

        <form class="search" id="searchForm" action="https://www.ecosia.org/search" method="GET" role="search" aria-label="Wyszukiwarka Ecosia">
            <input type="text" class="search-input" id="searchInput" name="q" placeholder="Wyszukaj w Ecosia..." required autocomplete="off" autofocus aria-label="Wprowadź frazę wyszukiwania">
            <button type="submit" class="search-btn" aria-label="Szukaj">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </button>
        </form>
    </main>

    <script src="blue.js" defer></script>
</body>
</html>
