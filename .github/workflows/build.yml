name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Uprawnienia wymagane przez GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tylko jedno wdrożenie naraz; nie przerywamy trwającego
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BIT_URL: https://github.com/HackerOS-Linux-System/bit/releases/download/v0.2/bit
  HACKERC_URL: https://github.com/HackerOS-Linux-System/HackerScript/releases/download/v0.5/hackerc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strona jest w całości w HackerScript (use <mode:website>) - nie ma już TypeScriptu,
      # npm ani esbuilda. Potrzebne są: bit (uruchamia polecenie `site` z Bit.hk),
      # hackerc (kompilator HackerScript) i Node.js (uruchamia scripts/build.hcs po kompilacji).
      - name: Check sources are in the repository
        run: |
          missing=0
          for f in Bit.hk scripts/build.hcs cmd/main.hcs cmd/blue.hcs cmd/page404.hcs cmd/offline.hcs cmd/sw.hcs \
                   cmd/lib/util.hcs cmd/lib/guard.hcs cmd/lib/idle.hcs; do
            if [ ! -f "$f" ]; then echo "::error::brak pliku $f w repozytorium (czy katalog cmd/ i scripts/ zostały dodane do commita?)"; missing=1; fi
          done
          git ls-files | head -50
          [ "$missing" = 0 ]

      - name: Download bit
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/bit" "$BIT_URL"
          chmod +x "$HOME/.local/bin/bit"

      - name: Download hackerc
        run: |
          curl -fsSL --retry 3 -o "$HOME/.local/bin/hackerc" "$HACKERC_URL"
          chmod +x "$HOME/.local/bin/hackerc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versions
        run: |
          bit --version
          hackerc --version || true
          node --version

      - name: Build site (bit site -> hackerc -> dist/)
        run: bit site

      - name: Sanity-check the build output
        run: |
          set -e
          for f in index.html script.js blue.html blue.js 404.html offline.html sw.js; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
          ! grep -q '__BUILD_ID__' dist/sw.js || { echo "::error::__BUILD_ID__ left in sw.js"; exit 1; }
          grep -q 'hackeros-offline' dist/404.html dist/offline.html
          du -sh dist

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
